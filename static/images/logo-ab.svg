<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="vinotintoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D0E12" />
      <stop offset="100%" stop-color="#2D080A" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5BCD6" />
      <stop offset="100%" stop-color="#7B9BBF" />
    </linearGradient>
  </defs>

  <!-- Isotipo AB Monograma Circular de Lujo -->
  <g transform="translate(10, 10)">
    <!-- Círculo exterior delicado -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#4D0E12" stroke-width="1.8" stroke-dasharray="2 2" opacity="0.6"/>
    <circle cx="50" cy="50" r="41" fill="#FAF8F5" stroke="#4D0E12" stroke-width="1.5" />
    
    <!-- Elementos botánicos / Hojas sutiles en Vinotinto y Azul Cielo -->
    <path d="M50,15 C52,24 57,28 65,30 C56,32 52,38 50,45 C48,38 44,32 35,30 C43,28 48,24 50,15 Z" fill="#4D0E12" opacity="0.9" />
    
    <!-- Letra A -->
    <text x="39" y="68" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="34" font-weight="600" font-style="italic" fill="#4A2E27" text-anchor="middle">A</text>
    <!-- Letra B -->
    <text x="61" y="68" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="34" font-weight="600" fill="#4D0E12" text-anchor="middle">B</text>
    
    <!-- Línea decorativa base -->
    <path d="M30,76 Q50,81 70,76" fill="none" stroke="#A5BCD6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="82" r="2" fill="#4D0E12"/>
  </g>

  <!-- Logotipo Tipográfico Alice Brand -->
  <g transform="translate(125, 20)">
    <!-- ALICE -->
    <text x="0" y="46" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="38" font-weight="700" letter-spacing="4" fill="#231815">
      ALICE
    </text>
    <!-- BRAND -->
    <text x="145" y="46" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="20" font-weight="300" letter-spacing="8" fill="#4D0E12">
      BRAND
    </text>
    <!-- Subtítulo Costero -->
    <text x="2" y="70" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="9" font-weight="500" letter-spacing="4.5" fill="#4A2E27" opacity="0.85">
      SWIMWEAR &amp; RESORT WEAR · COLOMBIA
    </text>
    <!-- Línea divisoria sutil -->
    <line x1="2" y1="80" x2="335" y2="80" stroke="#A5BCD6" stroke-width="2"/>
    <line x1="2" y1="80" x2="60" y2="80" stroke="#4D0E12" stroke-width="2"/>
  </g>
</svg>
